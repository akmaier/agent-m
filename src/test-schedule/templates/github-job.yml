  {{key}}:
    name: {{key}}
    if: {{condition}}
{{needs}}
    runs-on: {{runsOn}}
{{timeout}}
    strategy:
      fail-fast: false
      matrix:
        shard: [{{shards}}]
    env:
      AGENT_M_ROW: {{row}}
      AGENT_M_OCCASION: {{occasion}}
      AGENT_M_SHARD: ${{ matrix.shard }}
      AGENT_M_SHARDS: {{count}}
      AGENT_M_COMMAND: {{command}}
      AGENT_M_SECRETS: {{secretNames}}
      AGENT_M_INSTANCE_COMMIT: {{commit}}
{{secrets}}
    steps:
{{checkouts}}
{{restore}}
{{setup}}
      - name: Run the tests of the row {{row}}
        run: node .agent-m/src/workflow-entries/main.mjs runTests
      - name: Keep the report and the status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: {{occasion}}.{{row}}.${{ matrix.shard }}
          path: agent-m-reports/
          if-no-files-found: ignore
          retention-days: 1
