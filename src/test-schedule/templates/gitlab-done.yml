agent-m-done:
  stage: .post
  image: node:22
  inherit:
    default: false
    variables: false
  environment:
    name: agent-m-write
    action: verify
{{timeout}}
  needs:
    - job: agent-m-records
      artifacts: true
  variables:
    AGENT_M_EXPECTED: {{expected}}
    AGENT_M_INSTANCE_COMMIT: {{commit}}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - {{clone}}
    - node .agent-m/src/workflow-entries/main.mjs onDoneCheck
