# MOD-workflow-entries' entry onApprovalsCommitted, run on a push to docs/approvals/ and on dispatch: it writes every approved SPEC change that no decision row names
# into SPEC.md byte for byte, or writes nothing for a stale approval, and commits what it wrote. This file does nothing but run the entry.
name: apply approvals

on:
  push:
    branches: [main]
    paths: ["docs/approvals/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-approvals
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the approved SPEC changes
        run: node src/workflow-entries/main.mjs onApprovalsCommitted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
