# Nightly: main's own check. Both suites run once more, as CI runs them, and fail the run when a test fails; Agent M's own
# SPEC is watched, and no test may open it (tests/test_release_sprint_02_c.py). Pull requests run both suites (tests.yml);
# a push to main runs none. Started by hand as well, from the repository's Actions page.
# It also runs the tests of level release of both suites, which a pull request into a sprint's branch leaves out (tests.yml;
# WHAT NO MODULE OWNS IS CHANGED BETWEEN JOBS). A test's level is read as the repository reads it (see tests.yml).
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Name the week of the apt cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the downloaded archives and package lists of xvfb and openbox
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/apt-archives
            /home/runner/apt-lists
          key: apt-xvfb-openbox-lists-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: apt-xvfb-openbox-lists-${{ runner.os }}-
      - name: Install xvfb and openbox
        run: |
          # Once, here, so that no test installs them: the tests that start Electron find openbox and install nothing (their own install stays the local fallback).
          mkdir -p /home/runner/apt-archives/partial /home/runner/apt-lists/partial
          apt_options="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o DPkg::Lock::Timeout=50 -o Dir::Cache::archives=/home/runner/apt-archives -o Dir::State::lists=/home/runner/apt-lists"
          # This job runs on the default branch, so the cache it saves is the one that pull requests into every branch restore.
          # With the cache restored nothing is fetched.
          if ! sudo apt-get $apt_options install --yes --no-install-recommends --no-download xvfb openbox; then
            # The cache is gone: from the mirror. azure.archive.ubuntu.com sometimes sends one file so slowly that apt neither fails nor tries
            # the next mirror: the first download is bounded, and when it fails archive.ubuntu.com becomes the mirror.
            sudo apt-get $apt_options update
            if ! sudo timeout 15 apt-get $apt_options install --download-only --yes --no-install-recommends xvfb openbox; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
              sudo apt-get $apt_options install --download-only --yes --no-install-recommends xvfb openbox
            fi
            sudo apt-get $apt_options install --yes --no-install-recommends xvfb openbox
          fi
          sudo chmod -R a+rX /home/runner/apt-archives /home/runner/apt-lists
          openbox --version
      - name: Install Bridge app packages
        run: npm install --prefix src/bridge-build --omit=dev --ignore-scripts
      - name: No test opens Agent M's own SPEC
        run: cd tests && AGENT_M_NIGHTLY=1 python3 -m unittest -v test_release_sprint_02_c
      - name: Read the level of each test file
        run: |
          cat > "$RUNNER_TEMP/level.mjs" <<'JS'
          // A test's level is read as the repository reads it: the Level: line of its header (testHeader of MOD-test-document); a
          // file without one, by the one level of its cases' declarations (testDeclarations of MOD-test-document).
          // Prints the files of level release (mode "release") or all the others (mode "rest").
          import { readFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const root = pathToFileURL(process.cwd() + "/").href;
          const { testHeader, testDeclarations } = await import(root + "src/test-document/index.mjs");
          const [mode, ...files] = process.argv.slice(2);
          const level = (f) => {
            const text = readFileSync(f, "utf8");
            const own = testHeader(f, text)?.level;
            if (own) return own;
            const levels = new Set(testDeclarations(f, text).map((d) => d.level));
            return levels.size === 1 ? [...levels][0] : null;
          };
          const chosen = files.filter((f) => (level(f) === "release") === (mode === "release"));
          if (!chosen.length) { console.error("no " + mode + " test file among " + files.length); process.exit(1); }
          console.log(chosen.join("\n"));
          JS
      - name: Release tests, Python
        run: |
          files=$(node "$RUNNER_TEMP/level.mjs" release tests/test*.py)
          cd tests && python3 -m unittest -v $(echo "$files" | sed 's|^tests/||; s|\.py$||')
      - name: Release tests, node
        run: |
          files=$(node "$RUNNER_TEMP/level.mjs" release tests/*.test.mjs)
          node --test $files
  bridge-build-real:
    # The real Linux build of the Bridge (TST-961006 of tests/bridge-build-build-platform.test.mjs): the real npm, electron-builder and
    # Electron, an AppImage, and the app started under a virtual display for the tunnel check. It takes minutes, so no pull request runs it
    # (A PULL REQUEST'S CI RUNS WITHIN TWO MINUTES); the job carries a timeout of its own.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb
      - name: Install Bridge app packages
        run: npm install --prefix src/bridge-build --omit=dev --ignore-scripts
      - name: Build the real Linux Bridge under a virtual display
        run: BRIDGE_BUILD_REAL=1 xvfb-run --auto-servernum node --test tests/bridge-build-build-platform.test.mjs
