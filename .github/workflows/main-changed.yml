# MOD-workflow-entries' entry onMainChanged, run on every push to the default branch: it adds the graph of the pushed commit and the impact lists of its
# decision and module files that are not accepted to the branch trace-cache, and the overview of the main page of that commit to the branch overview-cache,
# where the pages read them once instead of deriving them at every load. This file does nothing but run the entry. Each branch's first commit is made
# here, once, as an orphan commit.
name: main changed

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-changed
  cancel-in-progress: false

jobs:
  main-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Make the branches trace-cache and overview-cache, once, and fetch them
        run: |
          git config user.name "agent-m main-changed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in trace-cache overview-cache; do
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git checkout --orphan "$branch-first"
              git rm -rf --quiet .
              echo "The files of the commits of main, one each: <commit>.json." > README.md
              git add README.md
              git commit --quiet -m "$branch: the branch of the stored files"
              git push origin "$branch-first:refs/heads/$branch"
              git checkout --quiet --detach "$GITHUB_SHA"
            fi
            git fetch origin +$branch:$branch
          done
      - name: Store the records of this commit
        run: node src/workflow-entries/main.mjs onMainChanged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
