# MOD-workflow-entries' entry onMainChanged, run on every push to the default branch: it adds the graph of the pushed commit to the branch
# trace-cache, where the pages read it once instead of deriving it at every load. This file does nothing but run the entry, so that a change
# between jobs may add to it (WHAT NO MODULE OWNS IS CHANGED BETWEEN JOBS). The branch's first commit is made here, once, as an orphan commit.
name: main changed

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-changed
  cancel-in-progress: false

jobs:
  main-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Make the branch trace-cache, once, and fetch it
        run: |
          git config user.name "agent-m main-changed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin trace-cache > /dev/null; then
            git checkout --orphan trace-cache-first
            git rm -rf --quiet .
            echo "The graphs of the commits of main, one file each: <commit>.json." > README.md
            git add README.md
            git commit --quiet -m "trace-cache: the branch of the stored graphs"
            git push origin trace-cache-first:refs/heads/trace-cache
            git checkout --quiet --detach "$GITHUB_SHA"
          fi
          git fetch origin +trace-cache:trace-cache
      - name: Add the graph of this commit
        run: node src/workflow-entries/main.mjs onMainChanged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
