# Continuous integration: every push and pull request runs the whole suite.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python checks
        run: cd tests && python3 -m unittest -v
      - name: Dashboard core
        run: node --test tests/*.test.mjs
