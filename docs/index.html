<!doctype html>
<html lang="en">

  <meta name="description" content="Review dashboard of Agent M: use cases and SPEC changes, accepted by a commit in GitHub.">
  <link rel="stylesheet" href="assets/style.css">

</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">M</span>
      <div>
