<!doctype html>
<!-- Module: MOD-dashboard-app -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent M · Review</title>
  <meta name="description" content="Review dashboard of Agent M: use cases, architecture and SPEC changes, accepted by a commit on GitHub or GitLab.">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/vendor/mermaid.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">M</span>
      <div>
        <h1>Agent M <span class="sub">Review</span></h1>
        <p class="repo" id="repo-line">loading…</p>
      </div>
    </div>
    <label class="product">Product
      <select id="product" aria-label="Product"></select>
    </label>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>

  <div id="token-banner" class="banner-slot"></div>
  <div id="progress-bar" class="banner-slot" aria-live="polite"></div>

  <main id="main" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>

  <footer class="foot">
    Reads from GitHub and from the GitLab servers of your products. It writes only when you click —
    Accept, Save, Add product: one commit under your own account, made with your own token (SPEC §10).
  </footer>

  <script type="module" src="assets/dashboard-app.mjs"></script>
</body>
</html>
